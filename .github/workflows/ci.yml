name: Build & checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build & domain checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript accounting
        run: npm run test:core
      - name: Check native domain rules
        run: npm run test:native
      - name: Assemble APK and run Android lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload development APK and lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-debug-and-lint
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: warn

  ui:
    name: Browser flows & layouts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI and payment flows
        run: npm run test:ui
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-previews
          path: |
            test-results/home.png
            test-results/budgets.png
            test-results/search-bob.png
            test-results/search-fuel.png
            test-results/web-empty-desktop.png
            test-results/web-empty-mobile.png
          retention-days: 14
          if-no-files-found: warn
