<!doctype html>
<html lang="en-IN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';"><title>Paisa · Your money, made clear.</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg aria-hidden="true" class="svg-defs"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M17 13a5 5 0 0 1 4 5v3"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20M6 15h4"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 2.3L6 6l-2.3-.6-2 3.5L3.4 11v2l-1.7 2.1 2 3.5L6 18l2.4.7L9 21h4l.6-2.3L16 18l2.3.6 2-3.5-1.7-2.1v-2l1.7-2.1-2-3.5L16 6l-2.4-.7L13 3Z"/><circle cx="11" cy="12" r="3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</defs></svg>
<div id="app">
 <div id="demoBanner" class="demo-banner" hidden>Interactive preview · Sample data · No live SMS</div>
 <header class="topbar"><a class="wordmark" href="#home" aria-label="Paisa home"><span class="brand-mark">₹</span>paisa<span class="brand-dot">.</span></a><button id="settings" class="icon-btn" aria-label="Settings"><svg><use href="#i-settings"/></svg></button></header>
 <main id="main" tabindex="-1"></main>
 <button id="addEntry" class="add-entry"><svg><use href="#i-plus"/></svg>Entry</button>
 <nav class="bottom-nav" aria-label="Main navigation">
  <button data-nav="home" aria-current="page"><svg><use href="#i-home"/></svg><span>Home</span></button>
  <button data-nav="activity"><svg><use href="#i-list"/></svg><span>Activity</span></button>
  <button data-nav="debts"><svg><use href="#i-people"/></svg><span>Loans</span></button>
  <button data-nav="cards"><svg><use href="#i-card"/></svg><span>Bills</span></button>
 </nav>
</div>
<dialog id="sheet" aria-labelledby="sheetTitle"><form id="entryForm"><div class="sheet-heading"><div><p class="eyebrow" id="sheetEyebrow">QUICK ENTRY</p><h2 id="sheetTitle">What was this payment for?</h2></div><button type="button" class="icon-btn" id="closeSheet" aria-label="Close"><svg><use href="#i-close"/></svg></button></div><div id="sheetBody"></div><p id="formError" role="alert"></p><div id="sheetActions"></div></form></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<script src="finance.js"></script><script src="sync-core.js"></script><script src="app-v3.js"></script>
</body></html>
